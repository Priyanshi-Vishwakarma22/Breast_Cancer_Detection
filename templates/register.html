<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            background: linear-gradient(135deg, #A05AFF, #4BCBEB);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 50px;
            width: 440px;
        }
        h2 {
            text-align: center;
            color: #9E58FF;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 40px;
        }
        button {
            background: #A05AFF;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            cursor: pointer;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="pwd1" placeholder="Password (min 8)">
        <input type="password" id="pwd2" placeholder="Confirm Password">
        <button onclick="register()">Register</button>
        <p style="text-align:center"><a href="login.html">Already have account? Login</a></p>
        <div id="msg" class="msg"></div>
    </div>
    <script>
       function register() {
            const userData = {
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                password: document.getElementById('pwd1').value
             };

            fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
             })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") window.location.href = "/login";
                else document.getElementById('msg').innerHTML = data.message;
             });
         }
    </script>
</body>
</html>
